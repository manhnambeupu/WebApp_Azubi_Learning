worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ── I/O: vắt kiệt HDD 49MB/s, đẩy hết vào RAM ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 20;
    keepalive_requests 500;
    client_body_buffer_size 128k;

    # ── Gzip: comp_level 3 = cân bằng CPU i3-4005U vs bandwidth ──
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # ── Rate Limit zones (state trong RAM, ~160k IPs / 10MB) ──
    # api_read:  GET bai hoc, cau hoi — thoang (30 req/s burst 60)
    # api_write: POST nop bai, dang nhap — chat (5 req/s burst 15)
    limit_req_zone $binary_remote_addr zone=api_read:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Tra loi 429 thay vi 503 khi bi limit
    limit_req_status 429;
    limit_conn_status 429;

    # ── Proxy cache cho MinIO images (luu tren RAM /dev/shm) ──
    proxy_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=200m inactive=7d;

    upstream backend {
        server backend:3001;
        keepalive 16;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name azubivn.de www.azubivn.de;

        # ── Gioi han ket noi dong thoi: 1 IP toi da 30 connection ──
        limit_conn conn_limit 30;

        # ── Bao mat headers ──
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

        # ── API: doc (GET) — rate thoang ──
        location /api/ {
            limit_req zone=api_read burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;

            # Buffer response trong RAM, tranh ghi HDD
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
        }

        # ── API: ghi (POST/PUT/DELETE) — rate chat ──
        location ~ ^/api/(auth|submissions|admin/emails) {
            limit_req zone=api_write burst=15 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
        }

        # ── MinIO lesson images: cache 7 ngay trong RAM ──
        location ^~ /minio/lesson-images/ {
            proxy_pass http://minio:9000/lesson-images/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;

            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── MinIO general ──
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
        }

        # ── Frontend Next.js ──
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tang RAM buffer tranh ghi HDD cho Next.js Images
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 16 64k;
            proxy_busy_buffers_size 128k;# Cấp 1MB RAM mỗi connection để đệm file
            proxy_max_temp_file_size 0; #Tắt hoàn toàn tính năng ghi file tạm xuống HDD
        }
    }
}
